name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recompiler:
    name: Build recompiler + runtime (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --release
      - name: Unit tests (flag/cc semantics)
        run: cargo test -p gow-runtime --release
      - name: Run recompiler self-test on synthetic PE
        run: |
          python3 tools/make_test_pe.py > test_pe.bin
          ./target/release/gowrecomp test_pe.bin generated
          test -f generated/gow_table.c
          grep -q "gow_func_table" generated/gow_table.c
      - name: End-to-end control-flow test (lift a 2-function program and run it)
        run: |
          python3 tools/make_flow_pe.py > flow.bin
          ./target/release/gowrecomp flow.bin flowout
          clang -O2 -I runtime/include -I flowout tests/flow_runner.c \
            flowout/gow_shard_000.c flowout/gow_table.c \
            -L target/release -lgow_runtime -lpthread -ldl -Wl,-rpath,target/release \
            -o flow_runner
          ./flow_runner | tee flow_result.txt
          grep -q "rax=15" flow_result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gowrecomp-tools
          path: |
            target/release/gowrecomp
            tools/

  dxvk:
    name: Build DXVK Native (d3d11+dxgi) for Android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'
      - name: Host build tools (meson, ninja, glslang)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools meson
          # dxbc-spirv needs meson >= 1.0; upgrade from PyPI if apt is older.
          if [ "$(meson --version | cut -d. -f1)" -lt 1 ]; then
            pip3 install --break-system-packages --upgrade meson
          fi
          echo "meson $(meson --version)"
          echo "ninja $(ninja --version)"
          # glslang must be a *host* binary: it turns DXVK's own GLSL into *.h.
          glslangValidator --version | head -1
      - name: Clone DXVK v3.1.1 with submodules
        run: |
          git clone --recursive --depth 1 --branch v3.1.1 \
            https://github.com/doitsujin/dxvk.git dxvk-src
          git -C dxvk-src submodule update --init --recursive --depth 1
          # dxbc-spirv + libdisplay-info are subprojects (no .wrap) -> required.
          test -f dxvk-src/subprojects/dxbc-spirv/meson.build
          test -f dxvk-src/subprojects/libdisplay-info/meson.build
          test -f dxvk-src/include/vulkan/include/vulkan/vulkan.h
      - name: Apply Android patches (tools/patches)
        run: |
          cd dxvk-src
          for p in "$GITHUB_WORKSPACE"/tools/patches/*.patch; do
            echo "::group::git apply $(basename "$p")"
            git apply --verbose "$p"
            echo "::endgroup::"
          done
          echo "--- patch verification ---"
          grep -q "DXVK_WSI_ANDROID" meson.build
          test -f src/wsi/android/wsi_platform_android.cpp
          grep -q "dxvk_android_set_window" src/d3d11/d3d11.sym src/dxgi/dxgi.sym
      - name: Write Meson cross file
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > android-arm64.ini <<EOF
          [binaries]
          c          = '$TC/aarch64-linux-android29-clang'
          cpp        = '$TC/aarch64-linux-android29-clang++'
          ar         = '$TC/llvm-ar'
          strip      = '$TC/llvm-strip'
          pkg-config = 'pkg-config'

          [properties]
          needs_exe_wrapper = false

          [host_machine]
          system     = 'android'
          kernel     = 'linux'
          cpu_family = 'aarch64'
          cpu        = 'aarch64'
          endian     = 'little'

          [built-in options]
          c_args        = ['-fPIC']
          cpp_args      = ['-fPIC']
          c_link_args   = ['-Wl,-z,max-page-size=16384']
          cpp_link_args = ['-Wl,-z,max-page-size=16384']
          EOF
          cat android-arm64.ini
      - name: Configure (Android WSI, d3d11+dxgi only)
        run: |
          # No -Dnative=true: native mode is selected by system != 'windows'.
          # Route B: the Android WSI backend (P3/P4) removes the SDL/GLFW need.
          meson setup build dxvk-src \
            --cross-file android-arm64.ini \
            --buildtype release \
            -Dnative_sdl2=disabled \
            -Dnative_sdl3=disabled \
            -Dnative_glfw=disabled \
            -Denable_d3d8=false \
            -Denable_d3d9=false \
            -Denable_d3d10=false \
            -Denable_d3d11=true \
            -Denable_dxgi=true
      - name: Build the two libraries
        run: |
          ninja -C build src/d3d11/libdxvk_d3d11.so src/dxgi/libdxvk_dxgi.so
          ls -la build/src/d3d11/libdxvk_d3d11.so build/src/dxgi/libdxvk_dxgi.so
      - name: Verify symbols, packaging properties and strip
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p dist
          cp build/src/d3d11/libdxvk_d3d11.so dist/
          cp build/src/dxgi/libdxvk_dxgi.so dist/
          # Android packages lib<name>.so with an unversioned SONAME (P5b).
          for so in dist/libdxvk_d3d11.so dist/libdxvk_dxgi.so; do
            "$READELF" -d "$so" | grep -E 'SONAME|NEEDED' || true
          done
          # The symbols the runtime resolves with dlsym().
          "$READELF" --dyn-syms -W dist/libdxvk_dxgi.so | grep -E 'CreateDXGIFactory1|dxvk_android_set_window'
          "$READELF" --dyn-syms -W dist/libdxvk_d3d11.so | grep -E 'D3D11CreateDevice|dxvk_android_set_window'
          # Assert the exact names the bridge calls are present (fail loudly).
          "$READELF" --dyn-syms -W dist/libdxvk_dxgi.so | grep -q 'CreateDXGIFactory1'
          "$READELF" --dyn-syms -W dist/libdxvk_dxgi.so | grep -q 'dxvk_android_set_window'
          "$READELF" --dyn-syms -W dist/libdxvk_d3d11.so | grep -q 'D3D11CreateDevice'
          "$READELF" --dyn-syms -W dist/libdxvk_d3d11.so | grep -q 'dxvk_android_set_window'
          # tools/patches/0005: the runtime hands DXVK the adrenotools loader through this setter.
          "$READELF" --dyn-syms -W dist/libdxvk_dxgi.so | grep -q 'dxvk_vulkan_set_get_instance_proc_addr'
          "$READELF" --dyn-syms -W dist/libdxvk_d3d11.so | grep -q 'dxvk_vulkan_set_get_instance_proc_addr'
          # 16 KB page alignment for Android 15 devices.
          "$READELF" -lW dist/libdxvk_d3d11.so | grep -E 'LOAD' | head -3
          "$STRIP" --strip-debug dist/libdxvk_d3d11.so dist/libdxvk_dxgi.so
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-android-arm64
          path: |
            dist/libdxvk_d3d11.so
            dist/libdxvk_dxgi.so
      - name: Publish to a private release
        if: ${{ vars.DXVK_OUT_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ vars.DXVK_OUT_TAG }}"
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "${{ github.repository }}" \
                 --title "DXVK Native (Android arm64)" --prerelease \
                 --notes "libdxvk_d3d11.so + libdxvk_dxgi.so built from doitsujin/dxvk v3.1.1 with the Android WSI patches in tools/patches/."
          gh release upload "$TAG" dist/libdxvk_d3d11.so dist/libdxvk_dxgi.so --clobber \
            -R "${{ github.repository }}"
          gh release view "$TAG" -R "${{ github.repository }}" --json assets -q '.assets[].name'

  adrenotools:
    name: Build libadrenotools + hooks for Android arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android SDK/NDK (with CMake)
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018 cmake;3.22.1'
      - name: Host tools (ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          ninja --version
      - name: Clone libadrenotools at the pinned commit
        run: |
          # Pinned (8fae8ce254dfc1344527e05301e43f37dea2df80) for reproducibility;
          # --recursive pulls lib/linkernsbypass, the linker-namespace bypass the
          # hook needs.
          git clone --recursive https://github.com/bylaws/libadrenotools.git adrenotools-src
          git -C adrenotools-src checkout --detach \
            8fae8ce254dfc1344527e05301e43f37dea2df80
          git -C adrenotools-src submodule update --init --recursive
          # gen/bcenabler_patch.h ships pre-built; only build_asm.sh regenerates it.
          test -f adrenotools-src/gen/bcenabler_patch.h
          test -f adrenotools-src/lib/linkernsbypass/CMakeLists.txt
          git -C adrenotools-src rev-parse HEAD
      - name: Configure + build (arm64-v8a, API 29, shared)
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          # CMake installed by setup-android lives under the SDK, not on PATH.
          export PATH="$ANDROID_SDK_ROOT/cmake/3.22.1/bin:$PATH"
          cmake --version
          cmake -S adrenotools-src -B adrenotools-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build adrenotools-build --parallel "$(nproc)"
      - name: Collect, verify and strip
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p dist
          cp adrenotools-build/libadrenotools.so dist/
          cp adrenotools-build/src/hook/libhook_impl.so dist/
          cp adrenotools-build/src/hook/libmain_hook.so dist/
          cp adrenotools-build/src/hook/libfile_redirect_hook.so dist/
          cp adrenotools-build/src/hook/libgsl_alloc_hook.so dist/
          # c++_static: the libs are self-contained; no libc++_shared.so needed.
          # The one symbol the Rust runtime resolves.
          "$READELF" --dyn-syms -W dist/libadrenotools.so | grep -q 'adrenotools_open_libvulkan'
          # The hook the loader must find; it exports android_dlopen_ext.
          "$READELF" --dyn-syms -W dist/libmain_hook.so | grep -q 'android_dlopen_ext'
          for so in dist/libadrenotools.so dist/libmain_hook.so; do
            echo "== $so"; "$READELF" -d "$so" | grep -E 'SONAME|NEEDED' || true
          done
          "$STRIP" --strip-debug dist/*.so
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: adrenotools-android-arm64
          path: dist/*.so
      - name: Publish to a private release
        if: ${{ vars.ADRENOTOOLS_OUT_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ vars.ADRENOTOOLS_OUT_TAG }}"
          gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "${{ github.repository }}" \
                 --title "libadrenotools (Android arm64)" --prerelease \
                 --notes "libadrenotools.so + hook libs built from bylaws/libadrenotools @ 8fae8ce254dfc1344527e05301e43f37dea2df80 (BSD-2-Clause)."
          gh release upload "$TAG" dist/*.so --clobber -R "${{ github.repository }}"
          gh release view "$TAG" -R "${{ github.repository }}" --json assets -q '.assets[].name'

  game_so:
    name: Compile recompiled game into libgow_game.so (arm64)
    # Optional: only runs when SHARDS_ASSET points at a release with shards.tar.gz.
    if: ${{ vars.SHARDS_ASSET != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build runtime static lib for android
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android29-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          cargo build -p gow-runtime --release --target aarch64-linux-android
      - name: Fetch generated shards (private release asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p generated
          TAG="${{ vars.SHARDS_ASSET }}"
          if [ -z "$TAG" ]; then echo "no SHARDS_ASSET"; exit 1; fi
          set -x
          gh release view "$TAG" -R "${{ github.repository }}" --json assets || true
          gh release download "$TAG" -R "${{ github.repository }}" \
            -p 'shards.tar.gz' -O shards.tar.gz --clobber
          ls -la shards.tar.gz
          tar xzf shards.tar.gz
          ls generated | head
      - name: Compile shards and link libgow_game.so
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TC/aarch64-linux-android29-clang"
          export CC
          mkdir -p obj
          ls generated/gow_shard_*.c generated/gow_table.c | xargs -P "$(nproc)" -n1 sh -c '
            f="$1"; base=$(basename "$f" .c)
            "$CC" -O1 -fPIC -fno-strict-aliasing -I runtime/include -I generated -c "$f" -o "obj/$base.o"
          ' _
          "$CC" -shared -fPIC -Wl,-soname,libgow_game.so -o libgow_game.so obj/*.o \
            -L target/aarch64-linux-android/release -lgow_runtime
          ls -la libgow_game.so
      - uses: actions/upload-artifact@v4
        with:
          name: libgow_game-so
          path: libgow_game.so
      - name: Publish to a private release
        if: ${{ vars.SHARDS_OUT_TAG != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ vars.SHARDS_OUT_TAG }}" libgow_game.so --clobber \
            -R "${{ github.repository }}" || true

  android:
    name: Build Android runtime APK (arm64-v8a)
    needs: [game_so, dxvk, adrenotools]
    # Run even if game_so/dxvk were skipped or failed: then it falls back to
    # whatever .so are already on the releases, or a runtime-only APK.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build runtime + jni for arm64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build -p gow-runtime --release
      - name: Stage recompiled game library (if provided as a release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          # Allow an explicit override via a repo variable REPACK_ASSET (a release tag).
          ASSET_TAG="${{ vars.REPACK_ASSET }}"
          if [ -n "$ASSET_TAG" ]; then
            gh release download "$ASSET_TAG" -R "${{ github.repository }}" \
              -p 'libgow_game.so' -O android/app/src/main/jniLibs/arm64-v8a/libgow_game.so \
              && echo "staged libgow_game.so from release $ASSET_TAG" \
              || echo "no libgow_game.so on release $ASSET_TAG; APK will be runtime-only"
          else
            echo "REPACK_ASSET not set; APK is runtime-only (game .so loaded from device storage)"
          fi
          ls -la android/app/src/main/jniLibs/arm64-v8a/ || true
      - name: Stage DXVK Native d3d11+dxgi (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # DXVK is built by the `dxvk` job and published to the DXVK_OUT_TAG
          # release. Allow an explicit override via vars.DXVK_ASSET.
          TAG="${{ vars.DXVK_ASSET }}"
          [ -z "$TAG" ] && TAG="${{ vars.DXVK_OUT_TAG }}"
          DEST=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          if [ -z "$TAG" ]; then
            echo "DXVK_ASSET/DXVK_OUT_TAG not set; APK is runtime-only (no D3D11 backend)"
          else
            gh release download "$TAG" -R "${{ github.repository }}" \
              -p 'libdxvk_d3d11.so' -p 'libdxvk_dxgi.so' -D "$DEST" --clobber \
              && echo "staged DXVK d3d11+dxgi from release $TAG" \
              || echo "no DXVK .so on release $TAG; APK continues without a D3D11 backend"
          fi
          ls -la "$DEST" || true
      - name: Stage libadrenotools + hook libs (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Built by the `adrenotools` job. These MUST end up in nativeLibraryDir
          # (lib/arm64-v8a/ in the APK) with useLegacyPackaging = true, because
          # adrenotools_open_libvulkan loads the hooks by name from hookLibDir.
          TAG="${{ vars.ADRENOTOOLS_ASSET }}"
          [ -z "$TAG" ] && TAG="${{ vars.ADRENOTOOLS_OUT_TAG }}"
          DEST=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          if [ -z "$TAG" ]; then
            echo "ADRENOTOOLS_ASSET/ADRENOTOOLS_OUT_TAG not set; APK has no custom-driver support"
          else
            gh release download "$TAG" -R "${{ github.repository }}" \
              -p 'libadrenotools.so' -p 'libmain_hook.so' \
              -p 'libhook_impl.so' -p 'libfile_redirect_hook.so' -p 'libgsl_alloc_hook.so' \
              -D "$DEST" --clobber \
              && echo "staged libadrenotools + hooks from release $TAG" \
              || echo "no libadrenotools .so on release $TAG; APK continues on the system driver"
          fi
          ls -la "$DEST" || true
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gow-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
