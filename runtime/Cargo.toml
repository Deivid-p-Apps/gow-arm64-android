[package]
name = "gow-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Win32/NT + dispatcher runtime for recompiled God of War (2018)"

[lib]
name = "gow_runtime"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Enables the host boot harness entry points (tools/host_boot.c). Off by default
# so the device/APK build never includes the host-only boot path. (Termux rustc
# targets aarch64-linux-android, so cfg(target_os="android") is TRUE there — a
# Cargo feature is the reliable switch.)
hostboot = []
# Exports the native-Vulkan smoke-test entry point (`gow_vk_native_selftest`) so
# tools/vk_native_probe.c can drive the headless instance+swapchain+clear+present
# harness. Off by default; never part of the device/APK build.
vkprobe = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Native Vulkan backend (GOW_GFX_BACKEND=native). `loaded` dlopens libvulkan.so at
# runtime (no link-time Vulkan dependency), which is what the Android/Termux
# target needs; DXVK stays the default backend and is untouched.
ash = { version = "0.38", default-features = false, features = ["std", "loaded", "debug"] }
